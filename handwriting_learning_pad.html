<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HandwritingPad</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/handwriting_learning_pad.css') }}">
  <script src="https://stroke-order.learningweb.moe.edu.tw/js/playerShare.js"></script>
  <style>
    canvas {
      background-color: white;
      border: 1px solid black;
    }
    #character-input {
      font-size: 18px;
      padding: 5px;
      margin-bottom: 10px;
    }
    #submit-button {
      font-size: 18px;
      padding: 5px 10px;
    }
    #stroke_player {
      margin-top: 20px;
      width: 348px;
      height: 470px;
      border: 1px solid #ccc;
      margin-right: 20px;
      align-items: left; 
    }
     
  </style>
</head>
<body>
  <div class="logo" >
    <a href="{{ url_for('home') }}" style="text-decoration: none; color: inherit;">
      <img src="{{ url_for('static', filename='images/Icon shield alt.svg') }}" alt="Logo">
      <span>SignaTure</span>
    </a>
  </div>

<div class="all_canva">
  <br>
  <br>
  <div class="stroke_area">
    <input type="text" id="character-input" maxlength="1" placeholder="輸入一個漢字">
    <button id="submit-button">顯示筆順</button>
    <div id="stroke_player" style="width:347.99px; height:457.44px;"></div>
  </div>
  
  <div class="container">
    <div class="canvas-container">
      <!--<div id="animation-container"></div>-->
      <canvas id="canvas"></canvas>
      <div class="btns">
        <input id="line-width" type="range" min="1" max="10" value="5" step="0.1">
        <input id="color" type="color">
        <button id="destroy-btn">Clear</button>
        <button id="eraser-btn">Erase</button>
        <label for="file">Add Photo <input type="file" accept="image/*" id="file"></label>
        <button id="save-btn">Save</button>
        <button id="upload">Evaluate</button>
        <p id="prediction"></p>
      </div>
    </div>
  </div>
</div>

<div class="func-btns">
  <button id="backButton" onclick="goBack()">Back</button>
</div>
<script src="{{ url_for('static', filename='js/handwriting_learning_pad.js') }}"></script>
</body>
</html>
